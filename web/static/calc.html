<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>手写推演系统</title>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: auto;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, sans-serif;
        }
        .canvas-container {
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin: auto;
        }
        canvas {
            border: 2px dashed #93c5fd;
            border-radius: 8px;
            cursor: crosshair;
            background: #ffffff;
            display: block;
            margin: 0 auto 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            color: #ffffff;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-reset { background: #9ca3af; }
        .btn-reset:hover { background: #6b7280; }
        .btn-erase { background: #f87171; }
        .btn-erase:hover { background: #ef4444; }
        .btn-erase.active { box-shadow: 0 0 0 4px #fca5a5; }
        .btn-submit { background: #3b82f6; }
        .btn-submit:hover { background: #2563eb; }

        #result-box {
            font-size: 24px;
            color: #1f2937;
            min-height: 40px;
            font-weight: normal;
            padding: 15px;
            border-radius: 8px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* 🌟 新增：排版与徽章样式 */
        .raw-text { color: #4b5563; }
        .calc-res { color: #059669; font-weight: bold; font-size: 28px; }
        .success-badge {
            background: #d1fae5; color: #047857;
            font-size: 14px; padding: 4px 10px; border-radius: 20px;
            font-weight: bold; display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="board" width="800" height="400"></canvas>

        <div class="btn-group">
            <button class="btn-reset" onclick="resetCanvas()">↻ 重置</button>
            <button class="btn-erase" id="btnErase" onclick="toggleErase()">▱ 擦除</button>
            <button class="btn-submit" onclick="submitCanvas()">↑ 提交识别</button>
        </div>

        <div id="result-box">等待输入...</div>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const resultBox = document.getElementById('result-box');
        const btnErase = document.getElementById('btnErase');

        let isDrawing = false, lastX = 0, lastY = 0;
        let isEraser = false;

        function notifyParentToCollapse() {
            if (window.parent && window.parent.collapseSidebar) {
                window.parent.collapseSidebar();
            }
        }
        document.addEventListener('mousedown', notifyParentToCollapse);
        document.addEventListener('touchstart', notifyParentToCollapse);

        function initCanvas() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }
        initCanvas();

        function resetCanvas() {
            initCanvas();
            resultBox.innerText = "等待输入...";
            if(isEraser) toggleErase();
        }

        function toggleErase() {
            isEraser = !isEraser;
            if(isEraser) {
                btnErase.classList.add('active');
                btnErase.innerText = "正在擦除...";
            } else {
                btnErase.classList.remove('active');
                btnErase.innerText = "▱ 擦除";
            }
        }

        function start(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = (e.clientX || e.touches[0].clientX) - rect.left;
            lastY = (e.clientY || e.touches[0].clientY) - rect.top;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const curX = (e.clientX || e.touches[0].clientX) - rect.left;
            const curY = (e.clientY || e.touches[0].clientY) - rect.top;

            if(isEraser) {
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 30;
            } else {
                ctx.strokeStyle = '#111827';
                ctx.lineWidth = 6;
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(curX, curY);
            ctx.stroke();
            [lastX, lastY] = [curX, curY];
        }

        function end() { isDrawing = false; }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', end);

        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        window.addEventListener('touchend', end);

        async function submitCanvas() {
            resultBox.innerHTML = '<span style="color: #6b7280;">⚙️ 底层视觉引擎解析中...</span>';
            try {
                const base64Data = canvas.toDataURL('image/jpeg');
                const res = await fetch('/api/recognize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ image_base64: base64Data })
                });
                const data = await res.json();

                // 🌟 核心渲染更新：更漂亮的高亮展示
                if (data.calc && data.calc !== "?") {
                    resultBox.innerHTML = `
                        <span class="raw-text">识别原文：${data.result}</span>
                        <span class="calc-res">➡️ 结果：${data.calc}</span>
                        <span class="success-badge">✔️ 引擎计算通过</span>
                    `;
                } else if(data.result) {
                    resultBox.innerHTML = `<span class="raw-text">识别序列：${data.result}</span>`;
                } else {
                    resultBox.innerText = "未识别到有效特征，请重试";
                }
            } catch (err) {
                resultBox.innerText = "引擎连接中断，请检查后端运行状态。";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户主页</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --text-main: #262626;
            --text-secondary: #8c8c8c;
            --easy-color: #00b8a3;
            --mid-color: #ffc01e;
            --hard-color: #ff375f;
            --level-color: #1677ff; /* 新增段位主色调 */
            --border-color: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
        }

        /* 左侧个人信息栏 */
        .left-panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0288d1, #26c6da);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .profile-name { font-size: 20px; font-weight: 600; margin: 0; }

        .btn-edit {
            width: 100%;
            padding: 10px;
            border: 1px solid #d9d9d9;
            background: #fafafa;
            border-radius: 6px;
            color: #595959;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-edit:hover { background: #f0f0f0; }

        /* 右侧数据看板 */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 做题进度卡片 */
        .progress-card {
            display: flex;
            align-items: center;
            padding: 30px;
        }

        .chart-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin-right: 40px;
        }

        /* 环形图动态样式：改为单环段位系统 */
        .chart-bg { fill: none; stroke: #f0f0f0; stroke-width: 8; }
        .chart-value {
            fill: none; stroke: var(--level-color); stroke-width: 8; stroke-linecap: round;
            transform: rotate(-90deg); transform-origin: 50% 50%;
            stroke-dasharray: 314; stroke-dashoffset: 314;
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .chart-center {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .chart-center-num { font-size: 28px; font-weight: bold; color: var(--text-main); line-height: 1.2; }
        .chart-center-title { font-size: 13px; font-weight: 600; color: var(--level-color); margin-top: 4px; }
        .chart-center-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .stats-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .stat-row { display: flex; align-items: center; font-size: 14px; background: #fafafa; padding: 10px 15px; border-radius: 8px;}
        .stat-label { width: 50px; font-weight: 500; }

        /* 移除了灰色底槽，仅用彩色柱状图表示相对数量 */
        .stat-bar-container { flex: 1; height: 8px; margin: 0 15px; display: flex; align-items: center; }
        .stat-bar-fill { height: 100%; border-radius: 4px; width: 0%; transition: width 1s ease-out; }

        .stat-count { width: 60px; text-align: right; font-weight: 600; color: var(--text-main); }
        .stat-unit { font-weight: normal; color: var(--text-secondary); font-size: 12px; margin-left: 2px;}

        .lbl-easy { color: var(--easy-color); }
        .lbl-mid { color: var(--mid-color); }
        .lbl-hard { color: var(--hard-color); }
        .bg-easy { background: var(--easy-color); }
        .bg-mid { background: var(--mid-color); }
        .bg-hard { background: var(--hard-color); }

        /* 热力图卡片 */
        .heatmap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .heatmap-title { font-size: 16px; font-weight: 600; }
        .heatmap-title span { color: var(--text-secondary); font-size: 14px; font-weight: normal; margin-left: 10px;}

        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(52, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 3px;
            width: 100%;
        }

        .day-cell {
            aspect-ratio: 1;
            background-color: #ebedf0;
            border-radius: 2px;
            transition: transform 0.1s, background-color 0.5s;
            position: relative;
        }

        .day-cell:hover { transform: scale(1.2); box-shadow: 0 0 4px rgba(0,0,0,0.2); z-index: 10;}

        .day-cell::after {
            content: attr(data-tooltip); position: absolute; bottom: 150%; left: 50%; transform: translateX(-50%);
            background-color: rgba(36, 41, 47, 0.95); color: #ffffff; padding: 6px 10px; border-radius: 6px;
            font-size: 12px; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity 0.1s ease-in-out;
            z-index: 100; pointer-events: none; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .day-cell::before {
            content: ""; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            border-width: 5px; border-style: solid; border-color: rgba(36, 41, 47, 0.95) transparent transparent transparent;
            opacity: 0; visibility: hidden; transition: opacity 0.1s ease-in-out; z-index: 100; pointer-events: none;
        }

        .day-cell:hover::after, .day-cell:hover::before { opacity: 1; visibility: visible; }

        .lvl-1 { background-color: #9be9a8; }
        .lvl-2 { background-color: #40c463; }
        .lvl-3 { background-color: #30a14e; }
        .lvl-4 { background-color: #216e39; }

    </style>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="card">
                <div class="profile-header">
                    <div class="profile-avatar">M</div>
                    <div>
                        <h1 class="profile-name">Malinowski</h1>
                    </div>
                </div>
                <button class="btn-edit">编辑个人资料</button>
            </div>

            <div class="card" style="min-height: 120px;">
                <div style="font-size: 14px; font-weight: 600; margin-bottom: 15px;">勋章成就</div>
                <div style="color: var(--text-secondary); font-size: 32px; text-align: center; margin-top: 20px;" id="medal-count">0</div>
                <div style="color: var(--text-secondary); font-size: 12px; text-align: center; margin-top: 10px;" id="medal-text">即将获得：月度每日一题打卡</div>
            </div>
        </div>

        <div class="right-panel">

            <div class="card progress-card">
                <div class="chart-container">
                    <svg width="120" height="120" viewBox="0 0 120 120">
                        <circle class="chart-bg" cx="60" cy="60" r="50"></circle>
                        <circle class="chart-value" id="circle-level" cx="60" cy="60" r="50"></circle>
                    </svg>
                    <div class="chart-center">
                        <div class="chart-center-num" id="total-solved-text">0</div>
                        <div class="chart-center-title" id="level-title">Lv.1</div>
                        <div class="chart-center-sub" id="level-sub">初出茅庐</div>
                    </div>
                </div>

                <div class="stats-details">
                    <div class="stat-row">
                        <div class="stat-label lbl-easy">简单</div>
                        <div class="stat-bar-container"><div class="stat-bar-fill bg-easy" id="bar-easy"></div></div>
                        <div class="stat-count"><span id="easy-val">0</span><span class="stat-unit">题</span></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label lbl-mid">中等</div>
                        <div class="stat-bar-container"><div class="stat-bar-fill bg-mid" id="bar-mid"></div></div>
                        <div class="stat-count"><span id="mid-val">0</span><span class="stat-unit">题</span></div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-label lbl-hard">困难</div>
                        <div class="stat-bar-container"><div class="stat-bar-fill bg-hard" id="bar-hard"></div></div>
                        <div class="stat-count"><span id="hard-val">0</span><span class="stat-unit">题</span></div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="heatmap-header">
                    <div class="heatmap-title">过去一年共提交 <span id="heatmap-total-subs">0 次</span></div>
                    <div style="font-size: 13px; color: var(--text-secondary);">累计提交天数：<span id="heatmap-days">0</span> &nbsp;|&nbsp; 连续提交：<span id="heatmap-streak">0</span></div>
                </div>
                <div class="heatmap-grid" id="heatmap"></div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchRealUserData();
        });

        function notifyParentToCollapse() {
            if (window.parent && window.parent.collapseSidebar) {
                window.parent.collapseSidebar();
            }
        }
        document.addEventListener('mousedown', notifyParentToCollapse);
        document.addEventListener('touchstart', notifyParentToCollapse);

        async function fetchRealUserData() {
            try {
                const response = await fetch('/api/user/profile');
                if (!response.ok) throw new Error("网络响应不正常");
                const apiData = await response.json();

                renderProgress(apiData.progress);
                renderHeatmap(apiData.activity);
                document.querySelector('.profile-name').innerText = apiData.username;
                document.getElementById('medal-count').innerText = apiData.medals;
                document.getElementById('medal-text').innerText = "已达成：月度每日一题打卡";

            } catch (error) {
                console.warn("数据拉取失败，启用模拟数据以预览UI效果:", error);

                // 【测试用模拟数据】当后端未启动时，依然能看到段位环效果
                const mockData = {
                    progress: {
                        easy: { solved: 35, total: 0 },
                        medium: { solved: 12, total: 0 },
                        hard: { solved: 3, total: 0 }
                    },
                    activity: { totalSubmissions: 86, totalDays: 45, streakDays: 5 }
                };
                renderProgress(mockData.progress);
                renderHeatmap(mockData.activity);
                document.getElementById('medal-count').innerText = "3";
            }
        }

        // ==========================================
        // 核心渲染逻辑：段位系统 & 相对条形图
        // ==========================================
        function renderProgress(data) {
            const easySolved = data.easy.solved || 0;
            const midSolved = data.medium.solved || 0;
            const hardSolved = data.hard.solved || 0;

            const totalSolved = easySolved + midSolved + hardSolved;

            // 1. 定义段位经验规则
            const levelSystem = [
                { title: "初出茅庐", min: 0, max: 20 },
                { title: "小试牛刀", min: 20, max: 50 },
                { title: "渐入佳境", min: 50, max: 150 },
                { title: "登堂入室", min: 150, max: 500 },
                { title: "炉火纯青", min: 500, max: 1000 },
                { title: "一代宗师", min: 1000, max: 999999 }
            ];

            // 2. 计算当前所处段位
            let currentLevelIndex = 0;
            let currentLevel = levelSystem[0];
            for (let i = 0; i < levelSystem.length; i++) {
                if (totalSolved >= levelSystem[i].min && totalSolved < levelSystem[i].max) {
                    currentLevel = levelSystem[i];
                    currentLevelIndex = i + 1; // Lv.1 开始
                    break;
                }
            }

            // 3. 填充数字与文字
            document.getElementById('total-solved-text').innerText = totalSolved;
            document.getElementById('level-title').innerText = `Lv.${currentLevelIndex}`;
            document.getElementById('level-sub').innerText = currentLevel.title;

            document.getElementById('easy-val').innerText = easySolved;
            document.getElementById('mid-val').innerText = midSolved;
            document.getElementById('hard-val').innerText = hardSolved;

            // 4. 渲染右侧动态柱状图 (以解题数最多的难度为满格 100%)
            const maxCategoryCount = Math.max(easySolved, midSolved, hardSolved, 1); // 保底为1防止除以0
            setTimeout(() => {
                document.getElementById('bar-easy').style.width = (easySolved / maxCategoryCount * 100) + "%";
                document.getElementById('bar-mid').style.width = (midSolved / maxCategoryCount * 100) + "%";
                document.getElementById('bar-hard').style.width = (hardSolved / maxCategoryCount * 100) + "%";
            }, 100);

            // 5. 计算并渲染 SVG 段位进度环
            // 进度 = (当前总题数 - 当前段位门槛) / (下一段位门槛 - 当前段位门槛)
            const levelProgress = (totalSolved - currentLevel.min) / (currentLevel.max - currentLevel.min);
            const circumference = 314; // 圆周长 2 * PI * r (r=50)
            const offset = circumference - (circumference * levelProgress);

            setTimeout(() => {
                document.getElementById('circle-level').style.strokeDashoffset = offset;
            }, 100);
        }

        // ==========================================
        // 热力图渲染逻辑 (保持不变)
        // ==========================================
        function renderHeatmap(activityData) {
            document.getElementById('heatmap-total-subs').innerText = activityData.totalSubmissions + " 次";
            document.getElementById('heatmap-days').innerText = activityData.totalDays;
            document.getElementById('heatmap-streak').innerText = activityData.streakDays;

            const heatmap = document.getElementById('heatmap');
            heatmap.innerHTML = "";
            const totalCells = 52 * 7;

            if (activityData.totalSubmissions === 0) {
                for (let i = 0; i < totalCells; i++) {
                    const cell = document.createElement('div');
                    cell.classList.add('day-cell');
                    let targetDate = new Date();
                    targetDate.setDate(targetDate.getDate() - (totalCells - 1 - i));
                    let dateString = `${targetDate.getFullYear()}年${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;
                    cell.setAttribute('data-tooltip', `${dateString} 无提交`);
                    heatmap.appendChild(cell);
                }
                return;
            }

            let daysToLightUp = activityData.totalDays;
            if (daysToLightUp === 0 && activityData.totalSubmissions > 0) {
                daysToLightUp = 1;
            }
            daysToLightUp = Math.min(daysToLightUp, totalCells);

            let activeIndices = new Set();
            activeIndices.add(totalCells - 1);

            while(activeIndices.size < daysToLightUp) {
                let idx = Math.floor(Math.pow(Math.random(), 0.6) * (totalCells - 1));
                activeIndices.add(idx);
            }

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.classList.add('day-cell');

                let targetDate = new Date();
                targetDate.setDate(targetDate.getDate() - (totalCells - 1 - i));
                let dateString = `${targetDate.getFullYear()}年${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;

                if (activeIndices.has(i)) {
                    const intensity = (i === totalCells - 1) ? 3 : Math.floor(Math.random() * 4) + 1;
                    setTimeout(() => {
                        cell.classList.add(`lvl-${intensity}`);
                    }, i * 2);

                    let dailyCount = intensity * 2 + Math.floor(Math.random() * 2);
                    if (i === totalCells - 1 && activityData.totalSubmissions <= 3) {
                        dailyCount = 1;
                    }
                    cell.setAttribute('data-tooltip', `${dateString} 提交了 ${dailyCount} 次`);
                } else {
                    cell.setAttribute('data-tooltip', `${dateString} 无提交`);
                }
                heatmap.appendChild(cell);
            }
        }
    </script>
</body>
</html>
